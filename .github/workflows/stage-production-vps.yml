name: Stage production on new VPS

on:
  push:
    branches: [test]
    paths:
      - .github/workflows/stage-production-vps.yml
  workflow_dispatch:

concurrency:
  group: stage-production-vps
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify live TEST
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://test.olesiapro.ru/contact -o /tmp/test-contact.html
          grep -q 'id="root"' /tmp/test-contact.html
          grep -q 'noindex' /tmp/test-contact.html
      - name: Build production artifact
        env:
          VITE_YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}
        run: |
          set -euo pipefail
          npm run build
          mkdir -p dist/contact
          cp dist/index.html dist/contact/index.html
          test -f dist/index.html
          test -f dist/contact/index.html
          test -f dist/assets/*.js
          ! grep -q 'noindex, nofollow, noarchive' dist/index.html
      - name: Deploy production files to new VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -rlptDz --delete --checksum
          path: ./dist/
          remote_path: /var/www/olesiapro.ru
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
      - name: Verify production files on new VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            test -f /var/www/olesiapro.ru/index.html
            test -f /var/www/olesiapro.ru/contact/index.html
            test -d /var/www/olesiapro.ru/assets
      - name: Smoke new VPS before DNS switch
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --resolve 'olesiapro.ru:443:${{ secrets.DEPLOY_HOST }}' --max-time 20 https://olesiapro.ru/ -o /tmp/new-production.html
          grep -q 'id="root"' /tmp/new-production.html
          ! grep -q 'noindex, nofollow, noarchive' /tmp/new-production.html
          curl --fail --silent --show-error --location --resolve 'olesiapro.ru:443:${{ secrets.DEPLOY_HOST }}' --max-time 20 https://olesiapro.ru/contact -o /tmp/new-contact.html
          grep -q 'id="root"' /tmp/new-contact.html
          ! grep -q 'noindex, nofollow, noarchive' /tmp/new-contact.html
