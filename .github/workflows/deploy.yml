name: Deploy Olesiapro
on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: test
        type: choice
        options: [test, production]
      source_ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'test' || inputs.target }}
  cancel-in-progress: false
jobs:
  quality-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'test' || inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify TEST before production
        if: github.event_name != 'push' && inputs.target == 'production'
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --location --max-time 20 --dump-header - --output /tmp/test.html https://test.olesiapro.ru/)"
          grep -Eiq 'name=.robots.*noindex|noindex.*name=.robots' /tmp/test.html
          grep -q 'id="root"' /tmp/test.html
          curl --fail --silent --show-error --location --max-time 20 https://test.olesiapro.ru/contact -o /tmp/test-contact.html
          grep -q 'id="root"' /tmp/test-contact.html
      - name: Build
        env:
          VITE_YANDEX_METRIKA_ID: ${{ vars.YANDEX_METRIKA_ID }}
        run: npm run build
      - name: Enforce TEST noindex
        if: github.event_name == 'push' || inputs.target == 'test'
        run: |
          sed -i 's#<!--app-head-->#<meta name="robots" content="noindex, nofollow, noarchive" /><!--app-head-->#' dist/index.html
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/sitemap.xml
      - name: Materialize static route entry points
        run: |
          set -euo pipefail
          mkdir -p dist/contact
          cp dist/index.html dist/contact/index.html
      - name: Validate artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/contact/index.html
          test -f dist/assets/*.js
          if [ "${{ github.event_name == 'push' && 'test' || inputs.target }}" = test ]; then grep -q 'noindex' dist/index.html; grep -q 'noindex' dist/contact/index.html; else ! grep -q 'noindex' dist/index.html; ! grep -q 'noindex' dist/contact/index.html; fi
      - id: vars
        run: |
          if [ "${{ github.event_name == 'push' && 'test' || inputs.target }}" = production ]; then echo 'path=/var/www/olesiapro.ru' >> "$GITHUB_OUTPUT"; echo 'url=https://olesiapro.ru/' >> "$GITHUB_OUTPUT"; else echo 'path=/var/www/test.olesiapro.ru' >> "$GITHUB_OUTPUT"; echo 'url=https://test.olesiapro.ru/' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy dist only
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -rlptDz --delete --checksum
          path: ./dist/
          remote_path: ${{ steps.vars.outputs.path }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
      - name: Verify files on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            test -f '${{ steps.vars.outputs.path }}/index.html'
            test -f '${{ steps.vars.outputs.path }}/contact/index.html'
            test -d '${{ steps.vars.outputs.path }}/assets'
      - name: HTTP smoke test
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --max-time 20 '${{ steps.vars.outputs.url }}' -o /tmp/live.html
          grep -q 'id="root"' /tmp/live.html
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --max-time 20 '${{ steps.vars.outputs.url }}contact' -o /tmp/live-contact.html
          grep -q 'id="root"' /tmp/live-contact.html
          if [ "${{ github.event_name == 'push' && 'test' || inputs.target }}" = test ]; then grep -q 'noindex' /tmp/live.html; grep -q 'noindex' /tmp/live-contact.html; else ! grep -q 'noindex' /tmp/live.html; ! grep -q 'noindex' /tmp/live-contact.html; fi
